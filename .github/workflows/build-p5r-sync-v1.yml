name: Build Eden RC1 P5R SyncThrottle V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout exact Eden RC1 commit
        uses: actions/checkout@v4
        with:
          ref: 8e373eb714aa01117ec885680477501cdb572112
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK requirements
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Apply P5R Mali SyncThrottle V1 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cpp = Path("src/video_core/renderer_vulkan/vk_scheduler.cpp")
          hdr = Path("src/video_core/renderer_vulkan/vk_scheduler.h")
          gradle = Path("src/android/app/build.gradle.kts")

          s = cpp.read_text()

          old = '''#include <memory>
          #include <mutex>'''
          new = '''#include <algorithm>
          #include <memory>
          #include <mutex>'''
          if old not in s:
              raise SystemExit("vk_scheduler.cpp include anchor not found")
          s = s.replace(old, new, 1)

          old = '''namespace Vulkan {


          void Scheduler::CommandChunk::ExecuteAll'''
          new = '''namespace Vulkan {

          constexpr u64 MAX_PENDING_FLUSHES = 5;

          void Scheduler::CommandChunk::ExecuteAll'''
          if old not in s:
              raise SystemExit("vk_scheduler.cpp namespace anchor not found")
          s = s.replace(old, new, 1)

          old = '''u64 Scheduler::Flush(VkSemaphore signal_semaphore, VkSemaphore wait_semaphore) {
              // When flushing, we only send data to the worker thread; no waiting is necessary.
              const u64 signal_value = SubmitExecution(signal_semaphore, wait_semaphore);
              AllocateNewContext();
              return signal_value;
          }'''
          new = '''u64 Scheduler::Flush(VkSemaphore signal_semaphore, VkSemaphore wait_semaphore) {
              // P5R/Mali experiment: backport Eden #4085 in-flight flush throttling
              // onto RC1's Fast/Low GPU path while leaving the rest of RC1 untouched.
              const bool should_throttle = Settings::IsGPULevelLow();
              if (should_throttle) {
                  const u64 current_tick = master_semaphore->CurrentTick();
                  const u64 gap =
                      current_tick > last_submitted_tick ? current_tick - last_submitted_tick : 0;
                  const u64 step = (std::min)(MAX_PENDING_FLUSHES, gap);
                  const u64 new_tick = last_submitted_tick + step;
                  if (new_tick < current_tick) {
                      last_submitted_tick = new_tick;
                      master_semaphore->Wait(last_submitted_tick);
                  }
              }
              const u64 signal_value = SubmitExecution(signal_semaphore, wait_semaphore);
              AllocateNewContext();
              return signal_value;
          }'''
          if old not in s:
              raise SystemExit("vk_scheduler.cpp Flush anchor not found")
          cpp.write_text(s)

          s = hdr.read_text()
          old = '''    std::chrono::steady_clock::time_point start_time{};
              u64 frame_counter{};
              double current_target_fps{};
          };'''
          new = '''    std::chrono::steady_clock::time_point start_time{};
              u64 frame_counter{};
              double current_target_fps{};

              u64 last_submitted_tick = 0;
          };'''
          if old not in s:
              raise SystemExit("vk_scheduler.h tail anchor not found")
          hdr.write_text(s.replace(old, new, 1))

          s = gradle.read_text()
          old = 'applicationId = "dev.eden.eden_emulator"'
          new = 'applicationId = "dev.eden.eden_emulator.p5rsyncv1"'
          if old not in s:
              raise SystemExit("build.gradle.kts applicationId anchor not found")
          s = s.replace(old, new, 1)

          old = 'manifestPlaceholders += mapOf("appNameSuffix" to "")'
          new = 'manifestPlaceholders += mapOf("appNameSuffix" to " P5R Sync V1")'
          if old not in s:
              raise SystemExit("build.gradle.kts appNameSuffix anchor not found")
          s = s.replace(old, new, 1)

          gradle.write_text(s)
          PY

          git diff --check
          git diff -- src/video_core/renderer_vulkan/vk_scheduler.cpp \
                     src/video_core/renderer_vulkan/vk_scheduler.h \
                     src/android/app/build.gradle.kts

      - name: Build Standard Release APK
        shell: bash
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t standard -b Release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-RC1-P5R-SyncThrottle-V1
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
          
